name: Remi Notifications Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: remi-notifications-cron
  cancel-in-progress: true

jobs:
  call-edge-function:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke Supabase Edge Function
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "Calling https://${SUPABASE_PROJECT_REF}.functions.supabase.co/remi-notifications"
          curl -f -i --retry 3 --retry-delay 5 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://${SUPABASE_PROJECT_REF}.functions.supabase.co/remi-notifications"
